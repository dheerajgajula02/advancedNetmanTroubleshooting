id: border-ip-forwarding-off
title: Border router has IPv4 forwarding switched off
table: diagnose
priority: 100
description: 'A border router''s kernel has net.ipv4.ip_forward = 0 (its running config
  gained ''no ip forwarding''). It still answers pings for itself, still holds its
  NAT rule and its return routes, so every existing internet rule passes, but it silently
  drops all traffic hosts forward through it. Symptom: one or more hosts get no reply
  from 8.8.8.8 while both borders reach 8.8.8.8 and the host''s own gateway is reachable.'
trigger: Runs for service/internet, at the end of the checks.
match:
  tags:
  - service/internet
mode: shadow
position: end
tags:
- service/internet
source:
  by: ai
  incident: 20261109T031837Z-h1-internet
  note: deepseek-v4.1-flash
  approved_by: operator
  approved_at: '2026-11-08T20:51:53'
steps:
- id: s1
  ask: Is IPv4 forwarding switched off on border router r3, which carries the hosts'
    VLAN traffic to the ISP?
  check:
    name: output_has
    args:
      command: sysctl net.ipv4.ip_forward
      device: r3
      text: = 0
  then:
    found: cause config.forwarding_disabled device=r3
- id: s2
  ask: Same question for the other border router r4, in case it is the one on the
    path.
  check:
    name: output_has
    args:
      command: sysctl net.ipv4.ip_forward
      device: r4
      text: = 0
  then:
    found: cause config.forwarding_disabled device=r4
causes:
  config.forwarding_disabled: The border router's kernel has IPv4 forwarding disabled,
    so it answers pings and holds its NAT and return routes but drops every packet
    hosts forward through it.
end: stop This rule's checks found nothing, so the others carry on.
