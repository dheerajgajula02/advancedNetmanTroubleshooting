# nmas.shiplabs.net: Netman on debian-12-server-boulder, reached over NetBird (10.9.8.182).
# Installed on the GCP reverse proxy VM (instance-20260827-204955) at
# /etc/nginx/sites-available/nmas.shiplabs.net.conf, symlinked into sites-enabled.
# Copy kept in advancedNetmanTroubleshooting/deploy/nmas/.
#
# Cloudflare -> this nginx (TLS: Let's Encrypt, webroot /var/www/acme) -> NetBird -> boulder
#   /        the Netman GUI (lab4_gui), which signs people in itself (lab4_gui/access.py)
#   /ipam/   NetBox (container netbox-public, :8001), once Netman's /auth/verify says yes
#   /desk/   the service desk (:8771), once Netman's /auth/verify says yes
#   /prometheus/, /topology-api/, /guacamole/  the same way; /jenkins goes to jenkins.dheerajgajula.com
#
# NetBox takes the account from a header whose name is a shared secret, so that one
# line lives in /etc/nginx/nmas-netbox-secret.conf (root, mode 600):
#     proxy_set_header X-Nmas-User-<secret> $nmas_user;
# matching REMOTE_AUTH_HEADER in boulder:~/.config/nmas/netbox-public.env.

upstream nmas_netman { server 10.9.8.182:8050; }
upstream nmas_netbox { server 10.9.8.182:8001; }
upstream nmas_desk   { server 10.9.8.182:8771; }
upstream nmas_prometheus { server 10.9.8.99:9090; }   # prometheus-advnetman (10.0.0.95), NetBird
upstream nmas_topology   { server 10.9.8.238:8090; }  # topology API on grafana-advnetman (10.0.0.58), NetBird
upstream nmas_guacamole  { server 10.9.8.182:8088; }  # the lab's Guacamole (web SSH to the devices)

# Netman role -> NetBox group (netman-admin is a NetBox superuser; netman-user may edit
# everything through the ObjectPermission "netman-user: edit everything").
map $nmas_role $nmas_netbox_group {
    admin   netman-admin;
    default netman-user;
}

server {
    listen 80;
    listen [::]:80;
    server_name nmas.shiplabs.net;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://nmas.shiplabs.net$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nmas.shiplabs.net;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/nmas.shiplabs.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nmas.shiplabs.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/nmas.access.log;
    error_log /var/log/nginx/nmas.error.log;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 4m;

    # Is this browser signed in to Netman? 204 + X-Nmas-User/X-Nmas-Role, or 401.
    location = /_nmas_verify {
        internal;
        proxy_pass http://nmas_netman/auth/verify;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Nmas-Public 1;
        proxy_set_header X-Nmas-Country $http_cf_ipcountry;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location @nmas_signin { return 302 /login?next=$uri; }

    location = /ipam { return 301 /ipam/; }
    # NetBox's own web server (granian) serves static files at /static/ only, but with
    # BASE_PATH ipam/ NetBox links them as /ipam/static/. Same sign-in check as /ipam/.
    location /ipam/static/ {
        auth_request /_nmas_verify;
        proxy_pass http://nmas_netbox/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
    location /ipam/ {
        auth_request /_nmas_verify;
        auth_request_set $nmas_user $upstream_http_x_nmas_user;
        auth_request_set $nmas_role $upstream_http_x_nmas_role;
        error_page 401 = @nmas_signin;
        proxy_pass http://nmas_netbox;
        proxy_http_version 1.1;
        include /etc/nginx/nmas-netbox-secret.conf;
        proxy_set_header X-Nmas-Netbox-Group $nmas_netbox_group;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location = /desk { return 301 /desk/; }
    location /desk/ {
        auth_request /_nmas_verify;
        error_page 401 = @nmas_signin;
        proxy_pass http://nmas_desk/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Prometheus (read-only: started without --web.enable-admin-api or lifecycle). Its UI
    # works out its own path from the address bar, so only the redirect needs the prefix.
    location = /prometheus { return 301 /prometheus/; }
    location /prometheus/ {
        auth_request /_nmas_verify;
        error_page 401 = @nmas_signin;
        proxy_pass http://nmas_prometheus/;
        proxy_redirect / /prometheus/;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # The topology API: JSON about the data lake's sync. Reading only.
    location = /topology-api { return 301 /topology-api/; }
    location /topology-api/ {
        auth_request /_nmas_verify;
        error_page 401 = @nmas_signin;
        limit_except GET { deny all; }
        proxy_pass http://nmas_topology/;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Guacamole, the web SSH consoles to the lab devices. Signs in as the Netman account:
    # Guacamole's header login (deploy/nmas/guacamole-header.override.yml) reads the account
    # from a header whose name is a secret, in /etc/nginx/nmas-guacamole-secret.conf (600).
    location = /guacamole { return 301 /guacamole/; }
    location /guacamole/ {
        auth_request /_nmas_verify;
        auth_request_set $nmas_user $upstream_http_x_nmas_user;
        error_page 401 = @nmas_signin;
        proxy_pass http://nmas_guacamole/guacamole/;
        include /etc/nginx/nmas-guacamole-secret.conf;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 1h;           # an open console is one long websocket
    }

    # Jenkins keeps its own address and login (the user's choice, 2026-11-10).
    location = /jenkins { return 302 https://jenkins.dheerajgajula.com/; }
    location /jenkins/ { return 302 https://jenkins.dheerajgajula.com/; }

    location / {
        proxy_pass http://nmas_netman;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Nmas-Public 1;
        proxy_set_header X-Nmas-Country $http_cf_ipcountry;
        proxy_buffering off;          # device-job progress is a live event stream
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }
}
